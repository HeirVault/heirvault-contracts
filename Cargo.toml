[workspace]
resolver = "2"
members = ["contracts/heirvault", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/heirvault/heirvault-contracts"
rust-version = "1.84.0"

[workspace.dependencies]
soroban-sdk = "22.0.0"

# Version floor for a transitive dependency of `soroban-env-host`, which declares
# `ed25519-dalek = ">=2.0.0"` with no upper bound. Left alone, Cargo resolves
# ed25519-dalek 3.x, whose `rand_core` 0.10 traits do not satisfy the
# `rand_chacha` 0.3 the Soroban test host passes in, and every
# `soroban-sdk/testutils` test target fails to build. Constraining it once, here,
# unifies the graph back onto the 2.x line. Production (wasm) builds never reach
# it: it is only pulled in by the `testutils` feature.
ed25519-dalek = "2.2.0"

# Release profile tuned for a small, cheap-to-upload WASM artifact.
# See README "Resource and WASM size" for the rationale behind each setting.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
