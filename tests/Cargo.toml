[package]
name = "heirvault-integration-tests"
description = "End-to-end tests that consume the HeirVault contract the way an external SDK or frontend would"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The package exists only to host integration tests.
path = "src/lib.rs"

[[test]]
name = "end_to_end"
path = "integration/end_to_end.rs"

[dependencies]
heirvault = { path = "../contracts/heirvault" }
soroban-sdk = { workspace = true, features = ["testutils"] }

[dev-dependencies]
ed25519-dalek = { workspace = true }
